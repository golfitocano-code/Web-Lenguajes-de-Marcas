<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/estilo.css">
     <!-- Iconos Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caramel&display=swap" rel="stylesheet">
   
    <title>Portada</title>
</head>

<body>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        /* Contenedor principal */
        .contacto {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            max-width: 1200px;
            margin: 50px auto;
            padding: 30px;
        }
    </style>

    <cabecera class="cabecera">
        <h1 id="nombre" style="color: goldenrod;">ARCAWEB</h1>
        <img id="logo" src="../img/logo1.png" alt="logo" style="width: 10%;">
    </cabecera>
    <menu>
        <nav class="navegador">
        <button  id="inicio" onclick="window.location.href='index.html'">Portada</button>

        <button id="oferta" onclick="window.location.href='oferta.html'">Nuestras Ofertas</button>

        <button id="proyecto" onclick="window.location.href='proyecto.html'">Nuestros Proyectos</button>

        <button id="contacto" onclick="window.location.href='contacto.html'">Contacto</button>
        </nav>
    </menu>

    <section class="gifts">

    <img src="../gifts/Collage animado de diseño y eventos ARCAWEB-1.gif">

    <img src="../gifts/Estudio creativo y eventos digitales animados-2.gif">
         

</section>
     

<!-- Iconos -->


<footer class="contacto-footer">
    <div class="contacto-footer-contenido">

        <!-- Contacto -->
        <div>
            <h3>Contacto</h3>

            <div class="contacto-footer-info">
                <div class="contacto-footer-dato">
                    <i class="fa-solid fa-phone"></i>
                    <a href="tel:+34900123456">900 123 456</a>
                </div>

                <div class="contacto-footer-dato">
                    <i class="fa-solid fa-envelope"></i>
                    <a href="mailto:info@arcaweb.es">info@arcaweb.es</a>
                </div>

                <div class="contacto-footer-dato">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Calle Ejemplo, 10, Ourense</span>
                </div>

                <div class="contacto-footer-dato">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <a href="https://maps.google.com/?q=Ourense,España"
                       target="_blank" rel="noopener noreferrer">
                        Ver ubicación
                    </a>
                </div>
            </div>

            <div class="contacto-footer-mapa">
                <iframe
                    src="https://maps.google.com/maps?q=Ourense%2C%20Espa%C3%B1a&output=embed"
                    loading="lazy"
                    title="Ubicación en Google Maps">
                </iframe>
            </div>
        </div>

        <!-- Redes sociales -->
        <div>
            <h3>Síguenos</h3>

            <div class="contacto-footer-redes">
                <a href="https://x.com/" target="_blank"
                   rel="noopener noreferrer">
                    <i class="fa-brands fa-x-twitter"></i>
                    <span>X / Twitter</span>
                </a>

                <a href="https://facebook.com/" target="_blank"
                   rel="noopener noreferrer">
                    <i class="fa-brands fa-facebook"></i>
                    <span>Facebook</span>
                </a>

                <a href="https://instagram.com/" target="_blank"
                   rel="noopener noreferrer">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram</span>
                </a>
            </div>
        </div>

    </div>
</footer>

<!-- Copyright debajo de esta franja -->

</div>


</body>
